<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1">
        <animate attributeName="stop-color" values="#667eea;#764ba2;#667eea" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1">
        <animate attributeName="stop-color" values="#764ba2;#667eea;#764ba2" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#f093fb;#4facfe;#f093fb" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0.8">
        <animate attributeName="stop-color" values="#4facfe;#f093fb;#4facfe" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Geometric growth pattern - fractal-inspired -->
    <pattern id="growthPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="2" fill="rgba(255,255,255,0.1)">
        <animate attributeName="r" values="2;3;2" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="50" cy="50" r="1.5" fill="rgba(255,255,255,0.08)" />
      <circle cx="150" cy="50" r="1.5" fill="rgba(255,255,255,0.08)" />
      <circle cx="50" cy="150" r="1.5" fill="rgba(255,255,255,0.08)" />
      <circle cx="150" cy="150" r="1.5" fill="rgba(255,255,255,0.08)" />
      <line x1="100" y1="100" x2="50" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
      <line x1="100" y1="100" x2="150" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
      <line x1="100" y1="100" x2="50" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
      <line x1="100" y1="100" x2="150" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Base gradient background -->
  <rect width="1200" height="800" fill="url(#grad1)" />

  <!-- Overlay gradient for depth -->
  <rect width="1200" height="800" fill="url(#grad2)" opacity="0.6" />

  <!-- Growth pattern overlay -->
  <rect width="1200" height="800" fill="url(#growthPattern)" />

  <!-- Floating geometric shapes -->
  <g class="floating-shapes">
    <!-- Hexagon 1 -->
    <polygon points="100,50 125,65 125,95 100,110 75,95 75,65"
             fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 10,-20; 0,0" dur="6s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate"
                        values="0 100 80; 360 100 80" dur="20s" repeatCount="indefinite" additive="sum" />
    </polygon>

    <!-- Hexagon 2 -->
    <polygon points="1000,200 1030,220 1030,260 1000,280 970,260 970,220"
             fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -15,25; 0,0" dur="8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate"
                        values="0 1000 240; -360 1000 240" dur="25s" repeatCount="indefinite" additive="sum" />
    </polygon>

    <!-- Circle cluster -->
    <circle cx="200" cy="600" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2">
      <animate attributeName="r" values="40;45;40" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="600" r="25" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5">
      <animate attributeName="r" values="25;28;25" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Triangle -->
    <polygon points="900,600 950,700 850,700"
             fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,-30; 0,0" dur="7s" repeatCount="indefinite" />
    </polygon>

    <!-- Network nodes - representing growth connections -->
    <g opacity="0.3">
      <circle cx="400" cy="300" r="3" fill="white">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="450" cy="280" r="3" fill="white">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="480" cy="320" r="3" fill="white">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite" />
      </circle>
      <line x1="400" y1="300" x2="450" y2="280" stroke="white" stroke-width="1" opacity="0.2" />
      <line x1="450" y1="280" x2="480" y2="320" stroke="white" stroke-width="1" opacity="0.2" />
      <line x1="480" y1="320" x2="400" y2="300" stroke="white" stroke-width="1" opacity="0.2" />
    </g>
  </g>

  <!-- Radial glow effect -->
  <circle cx="600" cy="400" r="300" fill="url(#grad1)" opacity="0.1">
    <animate attributeName="r" values="300;320;300" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
